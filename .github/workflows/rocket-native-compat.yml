name: RocketOS Phase 1 Native Compatibility Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1-compatibility-gate:
    name: Rocket Native Compatibility Gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out RocketOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run RocketOS test suite
        run: npm test

      - name: Run RocketOS TypeScript lint
        run: npm run lint

      - name: Run RocketOS production build
        run: npm run build

      - name: Run Rocket code compatibility audit harness
        run: npx tsx scripts/phase1/audit-rocket-files.ts

      - name: Clone authoritative Rocket repository at pinned commit
        run: |
          git clone --depth 1 https://github.com/RyanEid06/Rocket.git /tmp/rocket-pinned
          cd /tmp/rocket-pinned
          git checkout 3d62e5407b199a5b9318f3d9f6ccd090af8e45a9
          echo "Checked out authoritative Rocket at $(git rev-parse HEAD)"

      - name: Verify pinned Rocket toolchain metadata
        run: |
          grep -i "project(Rocket VERSION" /tmp/rocket-pinned/CMakeLists.txt
          cat /tmp/rocket-pinned/dependencies/manifest.json | grep -E '("version"|"url")' | head -n 20
