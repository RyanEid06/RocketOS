name: RocketOS Phase 1 Native Compatibility Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1-compatibility-gate:
    name: Rocket Native Compatibility Gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out RocketOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run RocketOS test suite
        run: npm test

      - name: Run RocketOS TypeScript lint
        run: npm run lint

      - name: Run RocketOS production build
        run: npm run build

      - name: Install native build prerequisites for Rocket compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libcurl4-openssl-dev libssl-dev libicu-dev \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libgl1-mesa-dev libasound2-dev

      - name: Clone authoritative Rocket repository at pinned commit
        run: |
          git clone --depth 1 https://github.com/RyanEid06/Rocket.git /tmp/rocket-pinned
          cd /tmp/rocket-pinned
          git fetch --depth 1 origin 3d62e5407b199a5b9318f3d9f6ccd090af8e45a9
          git checkout 3d62e5407b199a5b9318f3d9f6ccd090af8e45a9
          echo "Checked out authoritative Rocket at $(git rev-parse HEAD)"

      - name: Download raylib dependency and build pinned rocketc compiler
        run: |
          cd /tmp/rocket-pinned
          python3 -c '
          import sys, json
          sys.path.insert(0, "dependencies")
          import bootstrap
          manifest = json.loads(bootstrap.MANIFEST.read_text())
          bootstrap.install(manifest["shared"]["raylib"], "src/raylib.h")
          '
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DROCKETC_ENABLE_LLVM=OFF
          make -C build rocketc -j$(nproc) || cmake --build build --target rocketc -j$(nproc)
          ./build/rocketc --version

      - name: Run Rocket compatibility audit and actual compilation verification
        run: |
          export ROCKETC=/tmp/rocket-pinned/build/rocketc
          npx tsx scripts/phase1/audit-rocket-files.ts
