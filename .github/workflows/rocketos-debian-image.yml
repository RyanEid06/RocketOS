name: RocketOS Phase 2 Debian Foundation & Live ISO

on:
  push:
    branches: [main, 'phase3/**']
  pull_request:
    branches: [main, 'phase3/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian-foundation-gate:
    name: Build Debian 13 Live ISO & QEMU Smoke Test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out RocketOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node.js dependencies without lockfile
        run: npm install --package-lock=false

      - name: Run RocketOS test suite (Regression Gate)
        run: npm test

      - name: Run RocketOS TypeScript lint (Regression Gate)
        run: npm run lint

      - name: Run RocketOS production build (Regression Gate)
        run: npm run build

      - name: Install Host QEMU and Verification Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            ovmf \
            curl \
            ca-certificates

      - name: Prepare Artifacts Directory as Runner
        run: mkdir -p artifacts

      - name: Build RocketOS Debian 13 "Trixie" Live ISO (Debian Trixie Container)
        run: |
          docker run --privileged --rm \
            -v "${GITHUB_WORKSPACE:-$PWD}:/workspace" \
            -w /workspace \
            debian:trixie \
            bash -c "
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends \
                live-build \
                debootstrap \
                xorriso \
                isolinux \
                syslinux-utils \
                mtools \
                dosfstools \
                squashfs-tools \
                grub-pc-bin \
                grub-efi-amd64-bin \
                curl \
                ca-certificates
              echo '=== Live-Build Diagnostic Version ==='
              lb --version
              echo '=== Live-Build Config Help ==='
              lb config --help | head -n 35
              bash scripts/phase2/build-image.sh --output-dir artifacts
            "
          sudo chown -R "$(id -u):$(id -g)" artifacts

      - name: Run QEMU BIOS Boot Smoke Test
        run: |
          bash scripts/phase2/smoke-test-qemu.sh \
            --mode bios \
            --iso artifacts/rocketos-0.1-phase2-amd64.iso \
            --timeout 240

      - name: Run QEMU UEFI Boot Smoke Test
        run: |
          bash scripts/phase2/smoke-test-qemu.sh \
            --mode uefi \
            --iso artifacts/rocketos-0.1-phase2-amd64.iso \
            --timeout 240

      - name: Upload RocketOS Live ISO and Verification Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rocketos-0.1-phase2-amd64
          path: |
            artifacts/rocketos-0.1-phase2-amd64.iso
            artifacts/rocketos-0.1-phase2-amd64.iso.sha256
            artifacts/rocketos-0.1-phase2-amd64.manifest
            artifacts/*.log
          retention-days: 7
