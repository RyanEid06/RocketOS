name: RocketOS Phase 3 Graphical Session Foundation & Live ISO

on:
  push:
    branches: [main, 'phase3/**']
  pull_request:
    branches: [main, 'phase3/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graphical-foundation-gate:
    name: Build Phase 3 Graphical ISO & QEMU Smoke Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out RocketOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node.js dependencies without lockfile
        run: npm install --package-lock=false

      - name: Run RocketOS test suite (Regression Gate)
        run: npm test

      - name: Verify host recovery with surviving helper (Regression Gate)
        run: python3 scripts/phase3/test-host-recovery.py

      - name: Run RocketOS TypeScript lint (Regression Gate)
        run: npm run lint

      - name: Run RocketOS production build (Regression Gate)
        run: npm run build

      - name: Install Host QEMU and Verification Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-utils \
            netpbm \
            ovmf \
            curl \
            ca-certificates

      - name: Prepare Artifacts Directory as Runner
        run: mkdir -p artifacts

      - name: Build RocketOS Phase 3 Live Graphical ISO (Debian Trixie Container)
        run: |
          docker run --privileged --rm \
            -v "${GITHUB_WORKSPACE:-$PWD}:/workspace" \
            -w /workspace \
            debian:trixie \
            bash -c "
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends \
                live-build \
                debootstrap \
                dctrl-tools \
                cpio \
                apt-utils \
                file \
                rsync \
                wget \
                xz-utils \
                xorriso \
                isolinux \
                syslinux-common \
                syslinux-utils \
                mtools \
                dosfstools \
                squashfs-tools \
                grub-pc-bin \
                grub-efi-amd64-bin \
                grub-efi-ia32-bin \
                librsvg2-bin \
                curl \
                ca-certificates
              echo '=== Pre-Build Host Tool Verification ==='
              for cmd in lb debootstrap grep-dctrl cpio xorriso mksquashfs isohybrid rsvg-convert; do
                if ! command -v \$cmd >/dev/null 2>&1; then
                  echo \"ERROR: Required host build tool '\$cmd' is missing!\" >&2
                  exit 1
                fi
                echo \"  ✓ \$cmd found: \$(command -v \$cmd)\"
              done
              echo '=== Pre-Build Syslinux Tooling Verification ==='
              for pkg in syslinux-common isolinux syslinux-utils; do
                if ! dpkg -s \$pkg >/dev/null 2>&1; then
                  echo \"ERROR: Required Syslinux package '\$pkg' is not installed!\" >&2
                  exit 1
                fi
                echo \"  ✓ \$pkg installed: \$(dpkg -s \$pkg | grep -m1 '^Version:')\"
              done
              if [ ! -f /usr/lib/ISOLINUX/isolinux.bin ] && [ ! -f /usr/lib/syslinux/isolinux.bin ]; then
                echo \"ERROR: isolinux.bin is missing from host filesystem!\" >&2
                exit 1
              fi
              echo \"  ✓ isolinux.bin found\"
              if [ ! -f /usr/lib/syslinux/modules/bios/ldlinux.c32 ] && [ ! -f /usr/lib/syslinux/bios/ldlinux.c32 ]; then
                echo \"ERROR: ldlinux.c32 is missing from host filesystem!\" >&2
                exit 1
              fi
              echo \"  ✓ ldlinux.c32 found\"
              echo '=== Pre-Build GRUB EFI Tooling Verification ==='
              for pkg in grub-pc-bin grub-efi-amd64-bin grub-efi-ia32-bin; do
                if ! dpkg -s \$pkg >/dev/null 2>&1; then
                  echo \"ERROR: Required GRUB package '\$pkg' is not installed!\" >&2
                  exit 1
                fi
                echo \"  ✓ \$pkg installed: \$(dpkg -s \$pkg | grep -m1 '^Version:')\"
              done
              if [ ! -d /usr/lib/grub/x86_64-efi ]; then
                echo \"ERROR: /usr/lib/grub/x86_64-efi is missing from host filesystem!\" >&2
                exit 1
              fi
              echo \"  ✓ /usr/lib/grub/x86_64-efi found\"
              if [ ! -d /usr/lib/grub/i386-efi ]; then
                echo \"ERROR: /usr/lib/grub/i386-efi is missing from host filesystem!\" >&2
                exit 1
              fi
              echo \"  ✓ /usr/lib/grub/i386-efi found\"
              echo '=== Pre-Build Bootloader Splash Tooling Verification ==='
              if ! dpkg -s librsvg2-bin >/dev/null 2>&1; then
                echo \"ERROR: Required bootloader splash package 'librsvg2-bin' is not installed!\" >&2
                exit 1
              fi
              echo \"  ✓ librsvg2-bin installed: \$(dpkg -s librsvg2-bin | grep -m1 '^Version:')\"
              if ! command -v rsvg-convert >/dev/null 2>&1; then
                echo \"ERROR: Required tool 'rsvg-convert' is missing!\" >&2
                exit 1
              fi
              echo \"  ✓ rsvg-convert found: \$(command -v rsvg-convert)\"
              echo '=== Live-Build Diagnostic Version ==='
              lb --version
              echo '=== Live-Build Config Help ==='
              LB_HELP_FILE=\"\$(mktemp)\"
              if ! lb config --help >\"\${LB_HELP_FILE}\" 2>&1; then
                echo \"WARNING: lb config --help returned non-zero; continuing because this is diagnostic-only.\"
              fi
              sed -n '1,35p' \"\${LB_HELP_FILE}\"
              rm -f \"\${LB_HELP_FILE}\"
              bash scripts/phase3/build-image.sh --output-dir artifacts
            "
          sudo chown -R "$(id -u):$(id -g)" artifacts

      - name: Run QEMU BIOS Graphical Smoke Test
        run: |
          bash scripts/phase3/smoke-test-qemu.sh \
            --mode bios \
            --iso artifacts/rocketos-0.1-phase3-amd64.iso \
            --timeout 300

      - name: Run QEMU UEFI Graphical Smoke Test
        run: |
          bash scripts/phase3/smoke-test-qemu.sh \
            --mode uefi \
            --iso artifacts/rocketos-0.1-phase3-amd64.iso \
            --timeout 300

      - name: Generate Phase 3 Verification Report
        if: always()
        run: |
          mkdir -p artifacts
          {
            echo "=================================================="
            echo "RocketOS Phase 3 CI Verification Report"
            echo "=================================================="
            echo "Commit: $(git rev-parse HEAD 2>/dev/null || echo 'unknown')"
            echo "Timestamp: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "ISO: $(ls -lh artifacts/*.iso 2>/dev/null || echo 'not found')"
            echo "SHA256: $(cat artifacts/*.sha256 2>/dev/null || echo 'not found')"
            echo "Manifest: $(ls -lh artifacts/*.manifest 2>/dev/null || echo 'not found')"
            echo "Screenshots: $(ls -lh artifacts/*.ppm artifacts/*.png 2>/dev/null || echo 'none')"
            echo "Logs: $(ls -lh artifacts/*.log 2>/dev/null || echo 'none')"
            echo "=================================================="
          } > artifacts/phase3-verification-summary.txt

      - name: Upload RocketOS Graphical ISO and Verification Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rocketos-0.1-phase3-amd64
          path: |
            artifacts/rocketos-0.1-phase3-amd64.iso
            artifacts/rocketos-0.1-phase3-amd64.iso.sha256
            artifacts/rocketos-0.1-phase3-amd64.manifest
            artifacts/*.log
            artifacts/*.ppm
            artifacts/*.png
            artifacts/*.txt
          retention-days: 7
